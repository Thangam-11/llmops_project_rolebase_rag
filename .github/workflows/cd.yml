name: CD Pipeline

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: role-based-rag
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      ##################################################
      # Azure Login
      ##################################################

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      ##################################################
      # Login ACR
      ##################################################

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Verify Azure Resources
        run: |
          echo "===== Current Subscription ====="
          az account show --output table

          echo "===== Resource Groups ====="
          az group list --output table

          echo "===== Container Apps ====="
          az containerapp list --output table

          echo "===== ACR ====="
          az acr list --output table

      ##################################################
      # Build Image
      ##################################################

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest .

      ##################################################
      # Push Image
      ##################################################

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      ##################################################
      # Capture Current Revision (for rollback if needed)
      ##################################################

      - name: Capture Previous Active Revision
        id: previous_revision
        run: |
          PREV=$(az containerapp revision list \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query "[?properties.active].name | [0]" \
            -o tsv)
          echo "revision=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous active revision: $PREV"

      ##################################################
      # Deploy Azure Container App
      ##################################################

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
           --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }} \
            --set-env-vars \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
              QDRANT_URL="${{ secrets.QDRANT_URL }}" \
              QDRANT_API_KEY="${{ secrets.QDRANT_API_KEY }}" \
              SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              LANGSMITH_API_KEY="${{ secrets.LANGSMITH_API_KEY }}" \
              ENVIRONMENT="production"


            ##################################################
      # Debug URL
      ##################################################

      - name: Debug URL
        shell: bash
        run: |
          URL="https://${{ secrets.CONTAINER_APP_URL }}/health"

          echo "===================================="
          echo "Container App URL (secret will be masked):"
          echo "${{ secrets.CONTAINER_APP_URL }}"
          echo "Health URL:"
          echo "$URL"
          echo "===================================="

          curl -v -i "$URL" || true

      ##################################################
      # Wait for the new revision
      ##################################################

      - name: Wait for revision
        run: sleep 30

      ##################################################
      # Health Check
      ##################################################

      - name: Health Check
        id: health_check
        shell: bash
        run: |
          URL="https://${{ secrets.CONTAINER_APP_URL }}/health"

          for i in {1..12}; do
            HTTP_CODE=$(curl -s -L -o response.txt -w "%{http_code}" "$URL")

            echo "Attempt $i"
            echo "HTTP Status: $HTTP_CODE"
            echo "Response:"
            cat response.txt
            echo

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi

            echo "Retrying in 10 seconds..."
            sleep 10
          done

          echo "Health check failed after retries."
          exit 1
      ##################################################
      # Rollback on Failed Health Check
      ##################################################

      - name: Rollback to Previous Revision
        if: failure() && steps.health_check.outcome == 'failure' && steps.previous_revision.outputs.revision != ''
        run: |
          echo "Health check failed, rolling back to ${{ steps.previous_revision.outputs.revision }}"
          az containerapp revision activate \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --revision ${{ steps.previous_revision.outputs.revision }}
          az containerapp ingress traffic set \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --revision-weight ${{ steps.previous_revision.outputs.revision }}=100
          echo "Rollback complete. Traffic restored to previous revision."
          exit 1

      ##################################################
      # Show Success
      ##################################################

      - name: Deployment Complete
        run: |
          echo "======================================"
          echo "Deployment Successful"\

          
          echo "======================================"
          echo "Image:"
          echo "${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}"
          echo ""
          echo "Application URL:"
          echo "https://${{ secrets.CONTAINER_APP_URL }}"